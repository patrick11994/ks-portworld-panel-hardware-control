name: Release
# Releases are immutable in this repository: a published release can't get assets afterwards. So a pushed
# version tag builds the plugin, creates a draft release with the assets, and only then publishes it.
# Release with: git tag -a vX.Y.Z -m "Release notes" && git push origin vX.Y.Z
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os

          if os.environ['GITHUB_REF_TYPE'] != 'tag':
              raise SystemExit('Run this workflow on a release tag, not a branch.')
          PY
          if gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null | grep -qx false; then
            echo "Release $GITHUB_REF_NAME is already published; immutable releases can't get new assets. Tag a new version."
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test
        run: python3 tools/test.py
      - name: Build
        run: python3 tools/build.py --android-platform 35 --version "${GITHUB_REF_NAME#v}"
      - name: Create the draft release with its assets, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 dist/kiosk-satellite-plugin.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 dist/kiosk-satellite-plugin.json \
              --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes-from-tag
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
